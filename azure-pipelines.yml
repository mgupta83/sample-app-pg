trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  NODE_VERSION: '22.x'

stages:
  - stage: Build
    displayName: 'Build and Test'
    jobs:
      - job: BuildTest
        displayName: 'Build, Test, and Security Checks'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
            displayName: 'Install Node.js $(NODE_VERSION)'

          - script: |
              corepack enable
              corepack prepare pnpm@latest --activate
            displayName: 'Setup Corepack and pnpm'

          - script: pnpm install --frozen-lockfile
            displayName: 'Install dependencies'

          - script: pnpm run build
            displayName: 'Build project'

          - script: pnpm run test
            displayName: 'Run tests'

          - script: pnpm run biome:check
            displayName: 'Lint and format check'

          - script: pnpm run knip
            displayName: 'Check for unused dependencies'

          - script: pnpm run audit
            displayName: 'Run pnpm audit'
            continueOnError: true

          - script: |
              if command -v snyk &> /dev/null && [ -n "$(SNYK_TOKEN)" ]; then
                echo "Running Snyk security scan..."
                snyk test
              else
                echo "Snyk CLI not installed or token not set, skipping Snyk scan"
              fi
            displayName: 'Run Snyk security scan'
            env:
              SNYK_TOKEN: $(SNYK_TOKEN)
            continueOnError: true

          - script: |
              if command -v sonar-scanner &> /dev/null && [ -n "$(SONAR_TOKEN)" ]; then
                echo "Running SonarCloud scan..."
                sonar-scanner
              else
                echo "sonar-scanner not installed or token not set, skipping SonarCloud scan"
              fi
            displayName: 'Run SonarCloud analysis'
            env:
              SONAR_TOKEN: $(SONAR_TOKEN)
            continueOnError: true

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)/deploy'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/functionapp.zip'
              replaceExistingArchive: true
            displayName: 'Archive deployment files'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/functionapp.zip'
              ArtifactName: 'drop'
              publishLocation: 'Container'
            displayName: 'Publish artifacts'
